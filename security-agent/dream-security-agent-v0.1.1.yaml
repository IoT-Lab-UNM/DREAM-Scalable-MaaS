apiVersion: v1
kind: ConfigMap
metadata:
  name: dream-security-agent-v0-1-1
  namespace: edge-agents
data:
  security_agent.py: |
    import base64
    import hmac
    import json
    import logging
    import os
    import signal
    import threading
    import time
    import urllib.error
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    # ---------------------------------------------------------------------------
    # Configuration
    # ---------------------------------------------------------------------------

    VERSION = "0.1.1"

    NODE_NAME = os.environ["NODE_NAME"]
    NODE_CONFIG = json.loads(os.environ["NODE_CONFIG_JSON"])

    CONFIG = NODE_CONFIG.get(NODE_NAME)
    if not CONFIG:
        raise SystemExit(f"No security-agent mapping for node {NODE_NAME!r}")

    DEVICE_ID = CONFIG["device_id"]
    DPID = CONFIG["dpid"]

    SITE_ID = os.getenv("SITE_ID", "unm-lab")

    ONOS_URL = os.getenv(
        "ONOS_URL",
        "http://10.12.10.124:30181",
    ).rstrip("/")

    ONOS_USERNAME = os.environ["ONOS_USERNAME"]
    ONOS_PASSWORD = os.environ["ONOS_PASSWORD"]

    ENFORCEMENT_MODE = os.getenv(
        "ENFORCEMENT_MODE",
        "observe",
    ).strip().lower()

    POLL_INTERVAL_SECONDS = float(
        os.getenv("POLL_INTERVAL_SECONDS", "10")
    )

    HTTP_TIMEOUT_SECONDS = float(
        os.getenv("HTTP_TIMEOUT_SECONDS", "5")
    )

    METRICS_PORT = int(
        os.getenv("METRICS_PORT", "9102")
    )

    AGENT_TOKEN = os.getenv(
        "AGENT_TOKEN",
        "",
    )

    DREAM_FLOW_PRIORITY = int(
        os.getenv("DREAM_FLOW_PRIORITY", "49000")
    )

    DEVICE_OFPORT = str(
        os.getenv("DEVICE_OFPORT", "2")
    )

    VXLAN_OFPORT = str(
        os.getenv("VXLAN_OFPORT", "1")
    )

    if ENFORCEMENT_MODE not in {"observe", "enforce"}:
        raise SystemExit(
            f"Unsupported ENFORCEMENT_MODE={ENFORCEMENT_MODE!r}; "
            "expected observe or enforce"
        )

    if ENFORCEMENT_MODE == "enforce" and not AGENT_TOKEN:
        raise SystemExit(
            "AGENT_TOKEN is required when enforcement is enabled"
        )

    DEVICE_DROP_PRIORITY = DREAM_FLOW_PRIORITY + 1
    VXLAN_DROP_PRIORITY = DREAM_FLOW_PRIORITY + 2


    # ---------------------------------------------------------------------------
    # ONOS authentication
    # ---------------------------------------------------------------------------

    credentials = base64.b64encode(
        f"{ONOS_USERNAME}:{ONOS_PASSWORD}".encode("utf-8")
    ).decode("ascii")

    auth_headers = {
        "Authorization": f"Basic {credentials}",
        "Accept": "application/json",
    }


    # ---------------------------------------------------------------------------
    # Logging / shared state
    # ---------------------------------------------------------------------------

    logging.basicConfig(
        level=os.getenv("LOG_LEVEL", "INFO"),
        format="%(asctime)s %(levelname)s %(message)s",
    )

    state_lock = threading.Lock()
    stop_event = threading.Event()

    state = {
        "last_poll_at": None,
        "last_success_at": None,
        "last_success_epoch": None,
        "last_error": None,
        "onos_up": False,
        "device_available": False,
        "flow_count": 0,
        "drop_flow_count": 0,
        "polls_total": 0,
        "poll_failures_total": 0,
        "authentication_failures_total": 0,
        "enforcement_denied_total": 0,
        "enforcement_requests_total": 0,
        "enforcement_success_total": 0,
        "release_requests_total": 0,
        "release_success_total": 0,
        "enforcement_active": False,
        "dream_flow_ids": [],
    }


    # ---------------------------------------------------------------------------
    # Utility functions
    # ---------------------------------------------------------------------------

    def iso_now():
        return (
            datetime.now(timezone.utc)
            .isoformat()
            .replace("+00:00", "Z")
        )


    def onos_request(path, method="GET", payload=None):
        headers = dict(auth_headers)
        data = None

        if payload is not None:
            data = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"

        request = urllib.request.Request(
            ONOS_URL + path,
            headers=headers,
            data=data,
            method=method,
        )

        try:
            with urllib.request.urlopen(
                request,
                timeout=HTTP_TIMEOUT_SECONDS,
            ) as response:
                raw = response.read()

                if not raw:
                    return None

                content_type = response.headers.get(
                    "Content-Type",
                    "",
                )

                if "application/json" in content_type:
                    return json.loads(raw.decode("utf-8"))

                return raw.decode("utf-8")

        except urllib.error.HTTPError as exc:
            try:
                error_body = exc.read().decode(
                    "utf-8",
                    errors="replace",
                )
            except Exception:
                error_body = ""

            raise RuntimeError(
                f"ONOS HTTP {exc.code} for {method} {path}: "
                f"{error_body[:500]}"
            ) from exc


    def onos_get(path):
        result = onos_request(
            path,
            method="GET",
        )

        if result is None:
            return {}

        if not isinstance(result, dict):
            raise RuntimeError(
                f"Expected JSON object from ONOS GET {path}"
            )

        return result


    # ---------------------------------------------------------------------------
    # Flow inspection
    # ---------------------------------------------------------------------------

    def is_drop_flow(flow):
        treatment = flow.get("treatment") or {}
        instructions = treatment.get("instructions") or []

        try:
            priority = int(flow.get("priority", 0))
        except (TypeError, ValueError):
            priority = 0

        return (
            priority >= 40000
            and len(instructions) == 0
        )


    def get_in_port(flow):
        selector = flow.get("selector") or {}
        criteria = selector.get("criteria") or []

        for criterion in criteria:
            if criterion.get("type") == "IN_PORT":
                port = criterion.get("port")

                if port is not None:
                    return str(port)

        return None


    def is_dream_enforcement_flow(flow):
        try:
            priority = int(flow.get("priority", 0))
        except (TypeError, ValueError):
            return False

        treatment = flow.get("treatment") or {}
        instructions = treatment.get("instructions") or []

        if instructions:
            return False

        in_port = get_in_port(flow)

        if (
            priority == DEVICE_DROP_PRIORITY
            and in_port == DEVICE_OFPORT
        ):
            return True

        if (
            priority == VXLAN_DROP_PRIORITY
            and in_port == VXLAN_OFPORT
        ):
            return True

        return False


    def get_device_flows():
        payload = onos_get(
            f"/onos/v1/flows/{DPID}"
        )

        flows = payload.get("flows", [])

        if not isinstance(flows, list):
            raise RuntimeError(
                "ONOS flows response is not a list"
            )

        return flows


    def get_dream_flows():
        return [
            flow
            for flow in get_device_flows()
            if is_dream_enforcement_flow(flow)
        ]


    def dream_drop_flow(in_port, priority):
        return {
            "priority": priority,
            "timeout": 0,
            "isPermanent": True,
            "deviceId": DPID,
            "treatment": {
                "instructions": []
            },
            "selector": {
                "criteria": [
                    {
                        "type": "IN_PORT",
                        "port": str(in_port),
                    }
                ]
            },
        }


    # ---------------------------------------------------------------------------
    # DREAM enforcement
    # ---------------------------------------------------------------------------

    def refresh_enforcement_state():
        dream_flows = get_dream_flows()

        flow_ids = [
            str(flow["id"])
            for flow in dream_flows
            if flow.get("id") is not None
        ]

        ports = {
            get_in_port(flow)
            for flow in dream_flows
        }

        active = (
            DEVICE_OFPORT in ports
            and VXLAN_OFPORT in ports
        )

        with state_lock:
            state["enforcement_active"] = active
            state["dream_flow_ids"] = flow_ids

        return dream_flows


    def enforce_isolation():
        current_flows = get_dream_flows()

        existing = {
            (
                get_in_port(flow),
                int(flow.get("priority", 0)),
            )
            for flow in current_flows
        }

        desired_rules = [
            (
                DEVICE_OFPORT,
                DEVICE_DROP_PRIORITY,
            ),
            (
                VXLAN_OFPORT,
                VXLAN_DROP_PRIORITY,
            ),
        ]

        installed_new = []

        for in_port, priority in desired_rules:
            key = (in_port, priority)

            if key in existing:
                continue

            logging.warning(
                "security_enforcement_install "
                "device_id=%s dpid=%s "
                "in_port=%s priority=%s",
                DEVICE_ID,
                DPID,
                in_port,
                priority,
            )

            onos_request(
                f"/onos/v1/flows/{DPID}",
                method="POST",
                payload=dream_drop_flow(
                    in_port,
                    priority,
                ),
            )

            installed_new.append(
                {
                    "in_port": in_port,
                    "priority": priority,
                }
            )

        time.sleep(0.75)

        dream_flows = refresh_enforcement_state()

        ports = {
            get_in_port(flow)
            for flow in dream_flows
        }

        if not (
            DEVICE_OFPORT in ports
            and VXLAN_OFPORT in ports
        ):
            raise RuntimeError(
                "DREAM isolation flow verification failed"
            )

        logging.warning(
            "security_enforcement_active "
            "device_id=%s dpid=%s flows=%s",
            DEVICE_ID,
            DPID,
            [
                flow.get("id")
                for flow in dream_flows
            ],
        )

        return dream_flows, installed_new


    def release_isolation():
        dream_flows = get_dream_flows()

        removed_flow_ids = []

        for flow in dream_flows:
            flow_id = flow.get("id")

            if flow_id is None:
                continue

            flow_id = str(flow_id)

            logging.warning(
                "security_enforcement_release "
                "device_id=%s dpid=%s flow_id=%s",
                DEVICE_ID,
                DPID,
                flow_id,
            )

            onos_request(
                f"/onos/v1/flows/{DPID}/{flow_id}",
                method="DELETE",
            )

            removed_flow_ids.append(flow_id)

        time.sleep(0.75)

        remaining = refresh_enforcement_state()

        if remaining:
            raise RuntimeError(
                "DREAM enforcement flows remain after release"
            )

        logging.warning(
            "security_enforcement_released "
            "device_id=%s dpid=%s removed=%s",
            DEVICE_ID,
            DPID,
            removed_flow_ids,
        )

        return removed_flow_ids


    # ---------------------------------------------------------------------------
    # Authentication
    # ---------------------------------------------------------------------------

    def request_authenticated(handler):
        if not AGENT_TOKEN:
            return False

        header = handler.headers.get(
            "Authorization",
            "",
        )

        if not header.startswith("Bearer "):
            return False

        supplied = header[len("Bearer "):].strip()

        if not supplied:
            return False

        return hmac.compare_digest(
            supplied,
            AGENT_TOKEN,
        )


    # ---------------------------------------------------------------------------
    # Observation polling
    # ---------------------------------------------------------------------------

    def poll_once():
        polled_at = iso_now()

        with state_lock:
            state["last_poll_at"] = polled_at
            state["polls_total"] += 1

        try:
            devices_payload = onos_get(
                "/onos/v1/devices"
            )

            devices = devices_payload.get(
                "devices",
                [],
            )

            device = next(
                (
                    item
                    for item in devices
                    if item.get("id") == DPID
                ),
                None,
            )

            available = bool(
                device
                and device.get("available") is True
            )

            flows = get_device_flows()

            dream_flows = [
                flow
                for flow in flows
                if is_dream_enforcement_flow(flow)
            ]

            flow_ids = [
                str(flow["id"])
                for flow in dream_flows
                if flow.get("id") is not None
            ]

            dream_ports = {
                get_in_port(flow)
                for flow in dream_flows
            }

            enforcement_active = (
                DEVICE_OFPORT in dream_ports
                and VXLAN_OFPORT in dream_ports
            )

            success_epoch = time.time()

            with state_lock:
                state["last_success_at"] = polled_at
                state["last_success_epoch"] = success_epoch
                state["last_error"] = None
                state["onos_up"] = True
                state["device_available"] = available
                state["flow_count"] = len(flows)
                state["drop_flow_count"] = sum(
                    is_drop_flow(flow)
                    for flow in flows
                )
                state["enforcement_active"] = (
                    enforcement_active
                )
                state["dream_flow_ids"] = flow_ids

            logging.info(
                "security_observation "
                "device_id=%s dpid=%s "
                "available=%s flows=%s "
                "drop_flows=%s "
                "enforcement_active=%s "
                "dream_flows=%s",
                DEVICE_ID,
                DPID,
                available,
                len(flows),
                sum(
                    is_drop_flow(flow)
                    for flow in flows
                ),
                enforcement_active,
                len(dream_flows),
            )

        except Exception as exc:
            with state_lock:
                state["last_error"] = str(exc)
                state["onos_up"] = False
                state["device_available"] = False
                state["poll_failures_total"] += 1

            logging.error(
                "security_observation_failed "
                "device_id=%s dpid=%s error=%s",
                DEVICE_ID,
                DPID,
                exc,
            )


    # ---------------------------------------------------------------------------
    # Status / metrics
    # ---------------------------------------------------------------------------

    def snapshot():
        with state_lock:
            result = dict(state)

        last_epoch = result.pop(
            "last_success_epoch"
        )

        recent = bool(
            last_epoch is not None
            and time.time() - last_epoch
            <= max(
                25.0,
                POLL_INTERVAL_SECONDS * 2.5,
            )
        )

        result.update(
            {
                "service": "dream-security-agent",
                "version": VERSION,
                "mode": ENFORCEMENT_MODE,
                "node_name": NODE_NAME,
                "device_id": DEVICE_ID,
                "dpid": DPID,
                "site_id": SITE_ID,
                "device_ofport": DEVICE_OFPORT,
                "vxlan_ofport": VXLAN_OFPORT,
                "dream_flow_priority": DREAM_FLOW_PRIORITY,
                "ready": (
                    recent
                    and result["onos_up"]
                    and result["device_available"]
                ),
            }
        )

        return result


    def prometheus_text(current):
        labels = (
            f'device_id="{DEVICE_ID}",'
            f'node="{NODE_NAME}",'
            f'dpid="{DPID}",'
            f'site_id="{SITE_ID}"'
        )

        gauges = {
            "dream_security_agent_ready":
                1 if current["ready"] else 0,
            "dream_security_onos_up":
                1 if current["onos_up"] else 0,
            "dream_security_device_available":
                1 if current["device_available"] else 0,
            "dream_security_flow_count":
                current["flow_count"],
            "dream_security_drop_flow_count":
                current["drop_flow_count"],
            "dream_security_enforcement_active":
                1 if current["enforcement_active"] else 0,
        }

        counters = {
            "dream_security_polls_total":
                current["polls_total"],
            "dream_security_poll_failures_total":
                current["poll_failures_total"],
            "dream_security_authentication_failures_total":
                current["authentication_failures_total"],
            "dream_security_enforcement_denied_total":
                current["enforcement_denied_total"],
            "dream_security_enforcement_requests_total":
                current["enforcement_requests_total"],
            "dream_security_enforcement_success_total":
                current["enforcement_success_total"],
            "dream_security_release_requests_total":
                current["release_requests_total"],
            "dream_security_release_success_total":
                current["release_success_total"],
        }

        lines = []

        for name, value in gauges.items():
            lines.extend(
                [
                    f"# TYPE {name} gauge",
                    f'{name}{{{labels}}} {value}',
                ]
            )

        for name, value in counters.items():
            lines.extend(
                [
                    f"# TYPE {name} counter",
                    f'{name}{{{labels}}} {value}',
                ]
            )

        return "\n".join(lines) + "\n"


    # ---------------------------------------------------------------------------
    # HTTP API
    # ---------------------------------------------------------------------------

    class Handler(BaseHTTPRequestHandler):

        def send_json(self, status, payload):
            body = json.dumps(
                payload,
                separators=(",", ":"),
            ).encode("utf-8")

            self.send_response(status)
            self.send_header(
                "Content-Type",
                "application/json",
            )
            self.send_header(
                "Content-Length",
                str(len(body)),
            )
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            current = snapshot()

            if self.path == "/healthz":
                self.send_json(
                    200,
                    {
                        "status": "ok",
                        "service": "dream-security-agent",
                        "version": VERSION,
                        "device_id": DEVICE_ID,
                        "mode": ENFORCEMENT_MODE,
                    },
                )

            elif self.path == "/readyz":
                self.send_json(
                    200 if current["ready"] else 503,
                    current,
                )

            elif self.path == "/api/v1/status":
                self.send_json(
                    200,
                    current,
                )

            elif self.path == "/metrics":
                body = prometheus_text(
                    current
                ).encode("utf-8")

                self.send_response(200)
                self.send_header(
                    "Content-Type",
                    "text/plain; version=0.0.4",
                )
                self.send_header(
                    "Content-Length",
                    str(len(body)),
                )
                self.end_headers()
                self.wfile.write(body)

            else:
                self.send_json(
                    404,
                    {
                        "error": "not found",
                    },
                )

        def do_POST(self):
            if self.path != "/api/v1/enforce":
                self.send_json(
                    404,
                    {
                        "error": "not found",
                    },
                )
                return

            if ENFORCEMENT_MODE != "enforce":
                with state_lock:
                    state[
                        "enforcement_denied_total"
                    ] += 1

                self.send_json(
                    403,
                    {
                        "decision": "DENY",
                        "reason":
                            "enforcement_disabled_observation_mode",
                        "mode": ENFORCEMENT_MODE,
                        "device_id": DEVICE_ID,
                        "dpid": DPID,
                    },
                )
                return

            if not request_authenticated(self):
                with state_lock:
                    state[
                        "authentication_failures_total"
                    ] += 1

                self.send_json(
                    401,
                    {
                        "decision": "DENY",
                        "reason":
                            "authentication_required",
                        "device_id": DEVICE_ID,
                        "dpid": DPID,
                    },
                )
                return

            try:
                content_length = int(
                    self.headers.get(
                        "Content-Length",
                        "0",
                    )
                )
            except ValueError:
                self.send_json(
                    400,
                    {
                        "error":
                            "invalid Content-Length",
                    },
                )
                return

            if (
                content_length <= 0
                or content_length > 4096
            ):
                self.send_json(
                    400,
                    {
                        "error":
                            "invalid request body size",
                    },
                )
                return

            try:
                payload = json.loads(
                    self.rfile.read(
                        content_length
                    ).decode("utf-8")
                )
            except (
                json.JSONDecodeError,
                UnicodeDecodeError,
            ):
                self.send_json(
                    400,
                    {
                        "error": "invalid JSON",
                    },
                )
                return

            action = str(
                payload.get(
                    "action",
                    "",
                )
            ).strip().lower()

            try:
                if action == "enforce":
                    with state_lock:
                        state[
                            "enforcement_requests_total"
                        ] += 1

                    if not snapshot()[
                        "device_available"
                    ]:
                        self.send_json(
                            409,
                            {
                                "decision": "DENY",
                                "reason":
                                    "onos_device_unavailable",
                                "device_id":
                                    DEVICE_ID,
                                "dpid":
                                    DPID,
                            },
                        )
                        return

                    flows, installed_new = (
                        enforce_isolation()
                    )

                    with state_lock:
                        state[
                            "enforcement_success_total"
                        ] += 1

                    self.send_json(
                        200,
                        {
                            "decision": "ENFORCED",
                            "action": "isolate",
                            "device_id":
                                DEVICE_ID,
                            "dpid":
                                DPID,
                            "already_or_now_active":
                                True,
                            "installed_new":
                                installed_new,
                            "flow_ids": [
                                str(flow["id"])
                                for flow in flows
                                if flow.get("id")
                                is not None
                            ],
                        },
                    )

                elif action == "release":
                    with state_lock:
                        state[
                            "release_requests_total"
                        ] += 1

                    removed = (
                        release_isolation()
                    )

                    with state_lock:
                        state[
                            "release_success_total"
                        ] += 1

                    self.send_json(
                        200,
                        {
                            "decision": "RELEASED",
                            "action": "release",
                            "device_id":
                                DEVICE_ID,
                            "dpid":
                                DPID,
                            "removed_flow_ids":
                                removed,
                        },
                    )

                else:
                    self.send_json(
                        400,
                        {
                            "error":
                                "unsupported action",
                            "supported_actions": [
                                "enforce",
                                "release",
                            ],
                        },
                    )

            except Exception as exc:
                logging.exception(
                    "security_enforcement_failed "
                    "device_id=%s dpid=%s "
                    "action=%s",
                    DEVICE_ID,
                    DPID,
                    action,
                )

                self.send_json(
                    500,
                    {
                        "decision": "ERROR",
                        "action": action,
                        "device_id": DEVICE_ID,
                        "dpid": DPID,
                        "error": str(exc),
                    },
                )

        def log_message(self, *_args):
            return


    # ---------------------------------------------------------------------------
    # HTTP server / shutdown
    # ---------------------------------------------------------------------------

    def serve_http():
        server = ThreadingHTTPServer(
            ("0.0.0.0", METRICS_PORT),
            Handler,
        )

        server.serve_forever()


    def shutdown(_signum, _frame):
        stop_event.set()


    signal.signal(
        signal.SIGTERM,
        shutdown,
    )

    signal.signal(
        signal.SIGINT,
        shutdown,
    )

    threading.Thread(
        target=serve_http,
        name="security-http",
        daemon=True,
    ).start()

    logging.info(
        "security_agent_started "
        "version=%s node=%s device_id=%s "
        "dpid=%s mode=%s "
        "device_ofport=%s vxlan_ofport=%s",
        VERSION,
        NODE_NAME,
        DEVICE_ID,
        DPID,
        ENFORCEMENT_MODE,
        DEVICE_OFPORT,
        VXLAN_OFPORT,
    )

    while not stop_event.is_set():
        started = time.monotonic()

        poll_once()

        remaining = max(
            0.0,
            POLL_INTERVAL_SECONDS
            - (
                time.monotonic()
                - started
            ),
        )

        stop_event.wait(
            remaining
        )
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dream-security-agent
  namespace: edge-agents
  labels:
    app: dream-security-agent
    app.kubernetes.io/version: "0.1.1"
spec:
  selector:
    matchLabels:
      app: dream-security-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dream-security-agent
        app.kubernetes.io/version: "0.1.1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      hostNetwork: true
      dnsPolicy: Default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        edge.kubeedge.io/exclude-cni: "true"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gateway-role
                    operator: In
                    values: [printer, robot]
      tolerations:
        - key: node-role.kubeedge.io/edge
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: security-agent
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/security_agent.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_CONFIG_JSON
              value: '{"3dprinter":{"device_id":"ender3-printer-01","dpid":"of:0000000000000012"},"robotarm":{"device_id":"freenove-arm-01","dpid":"of:0000000000000011"}}'
            - name: SITE_ID
              value: unm-lab
            - name: ONOS_URL
              value: http://10.12.10.124:30181
            - name: ONOS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dream-onos-rest-credentials
                  key: username
            - name: ONOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dream-onos-rest-credentials
                  key: password
            - name: ENFORCEMENT_MODE
              value: observe
            - name: DREAM_FLOW_PRIORITY
              value: "49000"
            - name: DEVICE_OFPORT
              value: "2"
            - name: VXLAN_OFPORT
              value: "1"
            - name: POLL_INTERVAL_SECONDS
              value: "10"
            - name: HTTP_TIMEOUT_SECONDS
              value: "5"
            - name: METRICS_PORT
              value: "9102"
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: agent-code
              mountPath: /app/security_agent.py
              subPath: security_agent.py
              readOnly: true
      volumes:
        - name: agent-code
          configMap:
            name: dream-security-agent-v0-1-1
            defaultMode: 0555