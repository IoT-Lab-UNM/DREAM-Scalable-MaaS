apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: freenove-arm-01
  namespace: default
  labels:
    dream.unm/site: unm-lab
    dream.unm/device-type: freenove-arm
spec:
  deviceModelRef:
    name: freenove-arm-model
  nodeName: robotarm

  protocol:
    protocolName: customized
    configData:
      adapter: robot-mqtt

  stateReport:
    reportCycle: 3000
    reportToCloud: true

  properties:
    - name: availability
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: availability

    - name: operatingState
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: operatingState

    - name: currentTask
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: currentTask

    - name: commandAck
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: commandAck

    - name: fault
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: fault

    - name: requestedAction
      desired:
        value: NONE
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: requestedAction

    - name: lastUpdate
      collectCycle: 3000
      reportCycle: 3000
      reportToCloud: true
      visitors:
        protocolName: customized
        configData:
          dataType: string
          source: robot-mqtt
          field: lastUpdate
---
