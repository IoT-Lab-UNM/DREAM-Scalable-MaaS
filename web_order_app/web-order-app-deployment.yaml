
apiVersion: v1
kind: Namespace
metadata:
  name: maas
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-order-app-config
  namespace: maas
data:
  APP_NAME: "web-order-app"
  DEMO_MODE: "true"
  JOB_MANAGER_URL: "http://job-manager.maas.svc.cluster.local:8080"
  MARKETPLACE_URL: "http://marketplace.maas.svc.cluster.local:8080"
  POLICY_MANAGER_URL: "http://policy-management.maas.svc.cluster.local:8080"
  SLA_INTELLIGENCE_URL: "http://sla-intelligence.maas.svc.cluster.local:8080"
  ONOS_URL: "http://onos-service.maas.svc.cluster.local:8181"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-order-app
  namespace: maas
  labels:
    app: web-order-app
    component: maas-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-order-app
  template:
    metadata:
      labels:
        app: web-order-app
        component: maas-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: cloudnode
      containers:
        - name: web-order-app
          image: web-order-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: web-order-app-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-order-app
  namespace: maas
  labels:
    app: web-order-app
spec:
  type: NodePort
  selector:
    app: web-order-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
